{% set name = "bifidoannotator" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/bifidoannotator-{{ version }}.tar.gz
  sha256: dd547be343d6f50231e66b8014429aaa81cda6bdb3adb55635b7dd57fa93cdac

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - bifidoAnnotator = bifidoannotator.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - mmseqs2
    - pandas >=1.0.0
    - numpy >=1.18.0
    - matplotlib-base >=3.3.0
    - seaborn >=0.11.0
    - scipy >=1.5.0
    - setuptools

test:
  imports:
    - bifidoannotator
  commands:
    - bifidoAnnotator --help

about:
  home: https://github.com/nicholaspucci/bifidoAnnotator
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Fine-grained annotation of bifidobacterial glycoside hydrolases for human milk glycan utilization"
  description: |
    bifidoAnnotator performs hierarchical annotation of bifidobacterial GH-encoding genes
    using MMseqs2, with an optional transporter annotation module, HMG-utilization row
    annotation bars, cluster row filtering, and publication-ready heatmap generation.
  dev_url: https://github.com/nicholaspucci/bifidoAnnotator
  doc_url: https://github.com/nicholaspucci/bifidoAnnotator

extra:
  recipe-maintainers:
    - nicholaspucci
